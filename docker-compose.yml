version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: covid_table
      POSTGRES_USER: naga
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naga -d covid_table']
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    depends_on:
      postgres: 
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: covid_table
      DB_USER: naga
      DB_PASSWORD: password
      DB_PORT: 5432
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres_data: